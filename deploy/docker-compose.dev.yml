# Layanan pendukung pengembangan lokal (tanpa aplikasi):
# PostgreSQL 16, Redis, MinIO, Mailpit. Jalankan: docker compose -f deploy/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowcbt_app
      POSTGRES_PASSWORD: flowcbt_app
      POSTGRES_DB: flowcbt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: flowcbt
      MINIO_ROOT_PASSWORD: flowcbt-dev-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"   # UI
      - "1025:1025"   # SMTP

volumes:
  pgdata:
  miniodata:
